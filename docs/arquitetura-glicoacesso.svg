<text x="412" y="532" fill="#203e40" font-size="16" font-weight="400">PostgreSQL · estoque</text>
<rect x="750" y="456" width="335" height="92" rx="13" fill="white" stroke="#bad2c9"/>
<text x="766" y="485" fill="#144f42" font-size="21" font-weight="650">Reservas</text>
<text x="766" y="510" fill="#203e40" font-size="16" font-weight="400">Solicitação, decisões e histórico</text>
<text x="766" y="532" fill="#203e40" font-size="16" font-weight="400">PostgreSQL · reservas</text>
<rect x="1104" y="456" width="335" height="92" rx="13" fill="white" stroke="#bad2c9"/>
<text x="1120" y="485" fill="#144f42" font-size="21" font-weight="650">Retiradas</text>
<text x="1120" y="510" fill="#203e40" font-size="16" font-weight="400">Autorizações e entregas</text>
<text x="1120" y="532" fill="#203e40" font-size="16" font-weight="400">PostgreSQL · retiradas</text>
<text x="44" y="581" fill="#203e40" font-size="20" font-weight="400">CLI administrativa → Unidades     ·     Reservas → Unidades e Estoque     ·     Estoque → Unidades     ·     Retiradas → Reservas</text>
<text x="42" y="637" fill="#145a49" font-size="26" font-weight="670">Coordenação da reserva</text>
<rect x="42" y="656" width="315" height="92" rx="13" fill="white" stroke="#bad2c9"/>
<text x="58" y="685" fill="#144f42" font-size="21" font-weight="650">Orquestrador da SAGA</text>
<text x="58" y="710" fill="#203e40" font-size="16" font-weight="400">Confirmação e cancelamento</text>
<text x="58" y="732" fill="#203e40" font-size="16" font-weight="400">PostgreSQL · execuções e etapas</text>
<rect x="412" y="656" width="266" height="92" rx="13" fill="white" stroke="#bad2c9"/>
<text x="428" y="685" fill="#144f42" font-size="21" font-weight="650">Reservas</text>
<text x="428" y="710" fill="#203e40" font-size="16" font-weight="400">Registra o aceite</text>
<text x="428" y="732" fill="#203e40" font-size="16" font-weight="400">EM_CONFIRMACAO</text>
<rect x="735" y="656" width="270" height="92" rx="13" fill="white" stroke="#bad2c9"/>
<text x="751" y="685" fill="#144f42" font-size="21" font-weight="650">Estoque</text>
<text x="751" y="710" fill="#203e40" font-size="16" font-weight="400">Aloca a quantidade</text>
<text x="751" y="732" fill="#203e40" font-size="16" font-weight="400">Compensação libera o saldo</text>
<rect x="1062" y="656" width="375" height="92" rx="13" fill="white" stroke="#bad2c9"/>
<text x="1078" y="685" fill="#144f42" font-size="21" font-weight="650">Retiradas → Reservas¹</text>
<text x="1078" y="710" fill="#203e40" font-size="16" font-weight="400">Prepara a autorização</text>
<text x="1078" y="732" fill="#203e40" font-size="16" font-weight="400">Pivô em Reservas · CONFIRMADA</text>
<path d="M357 702 L408 702" fill="none" stroke="#33765f" stroke-width="2" marker-end="url(#arr)"/>
<path d="M678 702 L731 702" fill="none" stroke="#33765f" stroke-width="2" marker-end="url(#arr)"/>
<path d="M1005 702 L1058 702" fill="none" stroke="#33765f" stroke-width="2" marker-end="url(#arr)"/>
<text x="43" y="780" fill="#203e40" font-size="18" font-weight="400">¹ Ordem das etapas. Cada comando parte do Orquestrador. Na compensação, a revogação precede a liberação da alocação.</text>
<text x="43" y="807" fill="#203e40" font-size="18" font-weight="400">O BFF Cidadão solicita cancelamento distribuído. O BFF Unidade solicita confirmação e cancelamento distribuído.</text>
<text x="42" y="862" fill="#145a49" font-size="26" font-weight="670">Mensageria e consistência eventual</text>
<rect x="42" y="880" width="382" height="92" rx="13" fill="white" stroke="#bad2c9"/>
<text x="58" y="909" fill="#144f42" font-size="21" font-weight="650">Outbox transacional</text>
<text x="58" y="934" fill="#203e40" font-size="16" font-weight="400">Retiradas publica a entrega concluída.</text>
<text x="58" y="956" fill="#203e40" font-size="16" font-weight="400">Estoque publica movimentações.</text>
<rect x="481" y="880" width="300" height="92" rx="13" fill="white" stroke="#bad2c9"/>
<text x="497" y="909" fill="#144f42" font-size="21" font-weight="650">RabbitMQ</text>
<text x="497" y="934" fill="#203e40" font-size="16" font-weight="400">Filas duráveis por consumidor</text>
<text x="497" y="956" fill="#203e40" font-size="16" font-weight="400">Entrega assíncrona</text>
<rect x="840" y="880" width="597" height="92" rx="13" fill="white" stroke="#bad2c9"/>
<text x="856" y="909" fill="#144f42" font-size="21" font-weight="650">Consumidores</text>
<text x="856" y="934" fill="#203e40" font-size="16" font-weight="400">Entrega → Reservas, Estoque e Orquestrador</text>
<text x="856" y="956" fill="#203e40" font-size="16" font-weight="400">Movimentação → projeção de disponibilidade do Estoque</text>
