<path d="M781 926 L836 926" fill="none" stroke="#33765f" stroke-width="2" marker-end="url(#arr)"/>
<text x="42" y="1028" fill="#145a49" font-size="26" font-weight="670">Orientação com RAG</text>
<rect x="42" y="1048" width="339" height="92" rx="13" fill="white" stroke="#bad2c9"/>
<text x="58" y="1077" fill="#144f42" font-size="21" font-weight="650">BFF Cidadão</text>
<text x="58" y="1102" fill="#203e40" font-size="16" font-weight="400">Encaminha a pergunta sobre o item.</text>
<text x="58" y="1124" fill="#203e40" font-size="16" font-weight="400">Recebe orientação, fontes e consulta.</text>
<rect x="439" y="1048" width="445" height="92" rx="13" fill="white" stroke="#bad2c9"/>
<text x="455" y="1077" fill="#144f42" font-size="21" font-weight="650">Orientação · LangChain</text>
<text x="455" y="1102" fill="#203e40" font-size="16" font-weight="400">Tool → BFF Cidadão → disponibilidade atual</text>
<text x="455" y="1124" fill="#203e40" font-size="16" font-weight="400">Recuperação, geração, validação e fallback</text>
<rect x="942" y="1048" width="495" height="92" rx="13" fill="white" stroke="#bad2c9"/>
<text x="958" y="1077" fill="#144f42" font-size="21" font-weight="650">Google Gemini</text>
<text x="958" y="1102" fill="#203e40" font-size="16" font-weight="400">Embeddings de documentos e perguntas</text>
<text x="958" y="1124" fill="#203e40" font-size="16" font-weight="400">Geração estruturada a partir das evidências</text>
<path d="M381 1094 L435 1094" fill="none" stroke="#33765f" stroke-width="2" marker-end="url(#arr)"/>
<path d="M884 1094 L938 1094" fill="none" stroke="#33765f" stroke-width="2" marker-end="url(#arr)"/>
<rect x="42" y="1162" width="339" height="92" rx="13" fill="white" stroke="#bad2c9"/>
<text x="58" y="1191" fill="#144f42" font-size="21" font-weight="650">Guias do projeto</text>
<text x="58" y="1216" fill="#203e40" font-size="16" font-weight="400">Base documental versionada</text>
<text x="58" y="1238" fill="#203e40" font-size="16" font-weight="400">Solicitação, confirmação e retirada</text>
<rect x="439" y="1162" width="445" height="92" rx="13" fill="white" stroke="#bad2c9"/>
<text x="455" y="1191" fill="#144f42" font-size="21" font-weight="650">Indexador sob demanda</text>
<text x="455" y="1216" fill="#203e40" font-size="16" font-weight="400">Divide os guias e solicita embeddings ao Gemini.</text>
<text x="455" y="1238" fill="#203e40" font-size="16" font-weight="400">Atualiza o índice em uma transação.</text>
<rect x="942" y="1162" width="495" height="92" rx="13" fill="white" stroke="#bad2c9"/>
<text x="958" y="1191" fill="#144f42" font-size="21" font-weight="650">PostgreSQL · orientação</text>
<text x="958" y="1216" fill="#203e40" font-size="16" font-weight="400">pgvector · índice persistido em volume próprio</text>
<text x="958" y="1238" fill="#203e40" font-size="16" font-weight="400">Orientação consulta os trechos por similaridade.</text>
<path d="M381 1208 L435 1208" fill="none" stroke="#33765f" stroke-width="2" marker-end="url(#arr)"/>
<path d="M884 1208 L938 1208" fill="none" stroke="#33765f" stroke-width="2" marker-end="url(#arr)"/>
<rect x="42" y="1290" width="1395" height="180" rx="13" fill="#dfefe8" stroke="none"/>
<text x="66" y="1328" fill="#145a49" font-size="24" font-weight="670">Implantação · Docker Compose</text>
<text x="66" y="1360" fill="#203e40" font-size="18" font-weight="400">Gateway publicado no loopback do host. Rede de borda entre Gateway e BFFs; rede interna entre BFFs e serviços.</text>
<text x="66" y="1387" fill="#203e40" font-size="18" font-weight="400">Seis bancos independentes com volumes nomeados e redes de dados próprias. RabbitMQ usa a rede de mensageria.</text>
<text x="66" y="1414" fill="#203e40" font-size="18" font-weight="400">CLI e Unidades compartilham a rede administrativa. Orientação e indexador acessam o Gemini pela rede de saída.</text>
<text x="66" y="1441" fill="#203e40" font-size="18" font-weight="400">Base: 14 serviços permanentes. Perfil de orientação: mais 2 serviços. CLI e indexador são executados sob demanda.</text>
</g></svg>
