openapi: 3.0.3
info:
  title: BFF Cidadão
  version: "1.1.0"
  description: Agrega Unidades, Estoque e Reservas para o cidadão. Não exibe dados sensíveis operacionais.
servers:
  - url: /api/cidadao/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Preservado se for um UUID válido; caso contrário, um novo é gerado. Devolvido em toda resposta.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Reutilize a mesma chave ao repetir a mesma ação.
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    ErroComando:
      type: object
      required: [codigo]
      properties:
        codigo: { type: string }
        mensagem: { type: string }
    PedidoEmProcessamento:
      type: object
      additionalProperties: false
      required: [reservaId]
      properties:
        reservaId: { type: string, format: uuid }
    Link:
      type: object
      required: [href, method]
      properties:
        href: { type: string, minLength: 1 }
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        body:
          type: object
          additionalProperties: true
    ReservaCidadao:
      type: object
      required: [reservaId, unidadeId, itemId, quantidade, status]
      properties:
        reservaId: { type: string, format: uuid }
        unidadeId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        quantidade: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [SOLICITADA, EM_CONFIRMACAO, CONFIRMADA, CANCELAMENTO_EM_ANDAMENTO, CANCELADA, REJEITADA, EXPIRADA, FALHA_CONFIRMACAO, RETIRADA]
        itemNome: { type: string }
        unidadeNome: { type: string }
        enderecoLocal: { type: string }
        orientacoesRetirada: { type: string, minLength: 1 }
        criadaEm: { type: string, format: date-time }
        decisaoAte: { type: string, format: date-time }
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
    UnidadeCidadao:
      type: object
      required: [unidadeId, nome, endereco, horarioAtendimento, orientacoesRetirada]
      properties:
        unidadeId: { type: string, format: uuid }
        nome: { type: string }
        endereco: { type: string }
        horarioAtendimento: { type: string }
        orientacoesRetirada: { type: string, minLength: 1 }
    ItemCidadao:
      type: object
      required: [itemId, nome, tipo]
      properties:
        itemId: { type: string, format: uuid }
        nome: { type: string }
        tipo: { type: string, enum: [MEDICAMENTO, INSUMO] }
paths:
  /itens:
    parameters: [{ $ref: '#/components/parameters/CorrelationId' }]
    get:
      summary: Listar itens disponíveis para pesquisa
      responses:
        '200':
          description: Catálogo público de itens; não informa saldo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ItemCidadao' }
        '503': { description: "Serviço temporariamente indisponível. Em comandos, repita com a mesma chave e conteúdo." }
  /unidades:
    parameters: [{ $ref: '#/components/parameters/CorrelationId' }]
    get:
      summary: Listar unidades para consulta
      responses:
        '200':
          description: Unidades ativas com informações públicas de atendimento.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UnidadeCidadao' }
        '503': { description: "Serviço temporariamente indisponível. Em comandos, repita com a mesma chave e conteúdo." }
  /reservas:
    parameters: [{ $ref: '#/components/parameters/CorrelationId' }]
    post:
      summary: Criar solicitação de reserva
      description: Encaminha a solicitação autenticada do cidadão ao serviço Reservas.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [unidadeId, itemId, quantidade]
              properties:
                unidadeId: { type: string, format: uuid }
                itemId: { type: string, format: uuid }
                quantidade: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Solicitação criada com status SOLICITADA.
          headers:
            Location:
              description: Caminho público de consulta da reserva criada.
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaCidadao'
        '422':
          description: Unidade inexistente, inativa, com prazo legado acima de 720 horas, combinação sem permissão para reserva ou entrada inválida.
        '409':
          description: "`Idempotency-Key` reutilizada com conteúdo diferente."
        '401': { description: Credencial do cidadão ausente ou inválida. }
        '403': { description: "Ator sem permissão para a operação." }
        '503': { description: "Serviço temporariamente indisponível. Em comandos, repita com a mesma chave e conteúdo." }
  /reservas/{reservaId}/cancelar:
    parameters: [{ $ref: '#/components/parameters/CorrelationId' }]
    post:
      summary: Solicitar cancelamento da reserva pelo cidadão
      operationId: solicitarCancelamentoReserva
      description: >-
        O BFF chama primeiro o cancelamento local condicional em Reservas.
        O código CANCELAMENTO_DISTRIBUIDO seleciona o Orquestrador. Reservas
        persiste esse encaminhamento idempotente, para que uma repetição use o
        mesmo destino mesmo após a mudança de estado. É usada a mesma chave
        e o mesmo conteúdo a cada repetição em cada serviço. Outros conflitos
        ou um resultado incerto em Reservas não permitem redirecionar.
      security:
        - bearerAuth: []
      parameters:
        - name: reservaId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: "Cancelamento local concluído em Reservas."
        '202':
          description: "Cancelamento distribuído registrado para processamento. Consulte Location para acompanhar o estado da reserva."
          headers:
            Location:
              description: "Caminho público para acompanhar o estado de negócio, /api/cidadao/v1/reservas/{reservaId}."
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoEmProcessamento' }
        '400': { description: "Regra de negócio inválida ou justificativa obrigatória ausente." }
        '422':
          description: "Entrada inválida ou cabeçalho obrigatório ausente."
        '401':
          description: "Credencial ausente ou inválida."
        '403':
          description: "Chamador ou ator sem permissão."
        '404':
          description: "Recurso não encontrado."
        '409':
          description: "Cancelamento não permitido, em andamento com outro pedido ou chave usada com conteúdo diferente."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroComando' }
        '503':
          description: "Serviço temporariamente indisponível. Repita o comando com a mesma chave e conteúdo quando o resultado estiver incerto."
  /reservas/{reservaId}:
    parameters: [{ $ref: '#/components/parameters/CorrelationId' }]
    get:
      summary: Consultar reserva agregada (Cidadão)
      security:
        - bearerAuth: []
      parameters:
        - name: reservaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '422': { description: Entrada ou cabeçalho inválido. }
        '200':
          description: Vista segura e simplificada da reserva, com dados da unidade mesmo inativa. Dados complementares indisponíveis são omitidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaCidadao'
        '401': { description: Credencial do cidadão ausente ou inválida. }
        '404': { description: Reserva inexistente ou sem acesso para este cidadão. }
        '403': { description: "Ator sem permissão para a operação." }
        '422': { description: "Parâmetro, cabeçalho ou corpo inválido, inclusive campo não previsto." }
        '503': { description: "Serviço temporariamente indisponível. Em comandos, repita com a mesma chave e conteúdo." }
  /explorar:
    parameters: [{ $ref: '#/components/parameters/CorrelationId' }]
    get:
      summary: Explorar disponibilidade agregada
      parameters:
        - name: itemId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Lista de unidades com o respetivo status de estoque.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [unidadeId, nomeUnidade, endereco, horarioAtendimento, orientacoesRetirada, disponivel, permiteReserva, atualizadoEm]
                  properties:
                    unidadeId: { type: string, format: uuid }
                    nomeUnidade: { type: string }
                    endereco: { type: string }
                    horarioAtendimento: { type: string }
                    orientacoesRetirada: { type: string, minLength: 1 }
                    disponivel: { type: boolean, description: true quando quantidadeDisponivel da projeção for maior que zero. }
                    permiteReserva: { type: boolean, description: Permissão de negócio da combinação unidade/item; não é inferida do saldo. }
                    atualizadoEm:
                      type: string
                      format: date-time
                      description: Timestamp recebido da projeção de Estoque para o estado exibido, preservado pelo BFF sem substituição pelo horário de montagem da resposta.

        '422': { description: "Parâmetro, cabeçalho ou corpo inválido, inclusive campo não previsto." }
        '503': { description: "Serviço temporariamente indisponível. Em comandos, repita com a mesma chave e conteúdo." }
  /orientacoes:
    post:
      summary: Orientar o cidadão sobre um item do catálogo
      operationId: orientarCidadao
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [itemId, pergunta]
              properties:
                itemId: { type: string, format: uuid }
                pergunta: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Orientação e resultado estruturado da consulta de disponibilidade.
          content:
            application/json:
              schema:
                type: object
                required: [modo, resposta, fontes, consulta]
                properties:
                  modo:
                    type: string
                    enum: [rag, orientacao_basica, fora_do_escopo]
                  resposta: { type: string }
                  fontes:
                    type: array
                    items:
                      type: object
                      required: [id, titulo, secao]
                      properties:
                        id: { type: string }
                        titulo: { type: string }
                        secao: { type: string }
                  consulta:
                    type: object
                    required: [status, unidades]
                    properties:
                      status:
                        type: string
                        enum: [consultada, indisponivel, nao_consultada]
                      unidades:
                        type: array
                        items:
                          type: object
                          required: [unidadeId, nomeUnidade, disponivel, permiteReserva, atualizadoEm]
                          properties:
                            unidadeId: { type: string, format: uuid }
                            nomeUnidade: { type: string }
                            disponivel: { type: boolean }
                            permiteReserva: { type: boolean }
                            atualizadoEm: { type: string, format: date-time }
        '401': { description: Credencial ausente ou inválida. }
        '403': { description: Operação exclusiva do cidadão. }
        '404': { description: Item ausente do catálogo. }
        '422': { description: Dados da pergunta inválidos. }
        '429':
          description: Limite de chamadas ou de capacidade atingido.
          headers:
            Retry-After:
              schema: { type: integer }
        '502': { description: Serviço interno inacessível ou resposta inválida. }
        '503': { description: Orientação temporariamente indisponível. }
        '504': { description: Tempo de comunicação com serviço interno excedido. }
