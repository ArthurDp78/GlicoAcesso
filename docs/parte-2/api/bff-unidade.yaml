openapi: 3.0.3
info:
  title: BFF Unidade
  version: "1.1.0"
  description: Agrega informações operacionais para a equipe da unidade.
servers:
  - url: /api/unidade/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Reutilize a mesma chave ao repetir a mesma ação.
      schema: { type: string, minLength: 1 }
  schemas:
    ErroComando:
      type: object
      required: [codigo]
      properties:
        codigo: { type: string }
        mensagem: { type: string }
    PedidoEmProcessamento:
      type: object
      additionalProperties: false
      required: [reservaId]
      properties:
        reservaId: { type: string, format: uuid }
    Link:
      type: object
      required: [href, method]
      properties:
        href: { type: string, minLength: 1 }
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        body:
          type: object
          additionalProperties: true
    ReservaPainel:
      type: object
      required: [reservaId, unidadeId, itemId, quantidade, status]
      properties:
        reservaId: { type: string, format: uuid }
        unidadeId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        quantidade: { type: integer, minimum: 1 }
        cidadaoId: { type: string }
        status: { type: string, enum: [SOLICITADA, EM_CONFIRMACAO, CONFIRMADA, CANCELAMENTO_EM_ANDAMENTO, CANCELADA, REJEITADA, EXPIRADA, FALHA_CONFIRMACAO, RETIRADA] }
        itemNome: { type: string }
        orientacoesRetirada: { type: string, minLength: 1 }
        estoqueFisicoAtual: { type: integer, minimum: 0 }
        criadaEm: { type: string, format: date-time }
        decisaoAte: { type: string, format: date-time }
        dadosAutorizacao:
          type: object
          required: [autorizacaoId, status]
          properties:
            autorizacaoId: { type: string, format: uuid }
            status: { type: string, enum: [ATIVA, CANCELADA, UTILIZADA] }
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
    EstoquePainelItem:
      type: object
      required: [itemId, unidadeId, itemNome, estoqueFisicoAtual, quantidadeAlocada, quantidadeDisponivel, permiteReserva, atualizadoEm]
      properties:
        itemId: { type: string, format: uuid }
        unidadeId: { type: string, format: uuid }
        itemNome: { type: string }
        estoqueFisicoAtual: { type: integer, minimum: 0 }
        quantidadeAlocada: { type: integer, minimum: 0 }
        quantidadeDisponivel: { type: integer, minimum: 0 }
        permiteReserva: { type: boolean }
        atualizadoEm:
          type: string
          format: date-time
          description: Instante do estado da projeção exibido, não o horário da consulta.
    UnidadeOperacional:
      type: object
      required: [unidadeId, nome, endereco, horarioAtendimento, orientacoesRetirada, contatos, horarios, prazoAnaliseHoras, ativa]
      properties:
        unidadeId: { type: string, format: uuid }
        nome: { type: string }
        endereco: { type: string }
        horarioAtendimento: { type: string }
        orientacoesRetirada: { type: string, minLength: 1 }
        contatos:
          type: array
          items:
            type: object
            required: [tipo, valor]
            properties:
              tipo: { type: string }
              valor: { type: string }
        horarios:
          type: array
          items:
            type: object
            required: [diaSemana, horarioInicial, horarioFinal]
            properties:
              diaSemana: { type: integer, minimum: 1, maximum: 7 }
              horarioInicial: { type: string, format: time }
              horarioFinal: { type: string, format: time }
        prazoAnaliseHoras: { type: integer, minimum: 1 }
        ativa: { type: boolean }
    MovimentacaoResumo:
      type: object
      required: [movimentacaoId, unidadeId, itemId, variacaoFisica, ocorridaEm, estoqueVersion]
      properties:
        movimentacaoId: { type: string, format: uuid }
        unidadeId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        variacaoFisica: { type: integer }
        ocorridaEm: { type: string, format: date-time }
        estoqueVersion: { type: integer, format: int64, minimum: 0 }
    RetiradaRegistrada:
      type: object
      required: [retiradaId, autorizacaoId, realizadaEm]
      properties:
        retiradaId: { type: string, format: uuid }
        autorizacaoId: { type: string, format: uuid }
        realizadaEm: { type: string, format: date-time }
paths:
  /unidade:
    get:
      summary: Consultar cadastro e informações da unidade autenticada
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Cadastro atual da unidade vinculada ao profissional.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnidadeOperacional' }
        '403': { description: Ator sem unidade vinculada. }
    put:
      summary: Atualizar cadastro e informações de atendimento da unidade autenticada
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, logradouro, numero, bairro, cidade, estado, cep, orientacoesRetirada, contatos, horarios, prazoAnaliseHoras]
              properties:
                nome: { type: string, minLength: 1 }
                logradouro: { type: string, minLength: 1 }
                numero: { type: string, minLength: 1 }
                bairro: { type: string, minLength: 1 }
                cidade: { type: string, minLength: 1 }
                estado: { type: string, minLength: 1 }
                cep: { type: string, minLength: 1 }
                orientacoesRetirada: { type: string, minLength: 1 }
                contatos:
                  type: array
                  items:
                    type: object
                    required: [tipo, valor]
                    properties:
                      tipo: { type: string, minLength: 1 }
                      valor: { type: string, minLength: 1 }
                horarios:
                  type: array
                  items:
                    type: object
                    required: [diaSemana, horarioInicial, horarioFinal]
                    properties:
                      diaSemana: { type: integer, minimum: 1, maximum: 7 }
                      horarioInicial: { type: string, format: time }
                      horarioFinal: { type: string, format: time }
                prazoAnaliseHoras: { type: integer, minimum: 1 }
      responses:
        '200': { description: Cadastro atualizado. }
        '403': { description: Ator não pertence à unidade correspondente. }
        '409': { description: "`Idempotency-Key` reutilizada com conteúdo diferente." }
  /unidade/horarios:
    put:
      summary: Atualizar horários da unidade autenticada
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [horarios]
              properties:
                horarios:
                  type: array
                  items:
                    type: object
                    required: [diaSemana, horarioInicial, horarioFinal]
                    properties:
                      diaSemana: { type: integer, minimum: 1, maximum: 7 }
                      horarioInicial: { type: string, format: time }
                      horarioFinal: { type: string, format: time }
      responses:
        '200': { description: Horários atualizados. }
        '403': { description: Ator não pertence à unidade correspondente. }
        '409': { description: "`Idempotency-Key` reutilizada com conteúdo diferente." }
  /unidade/status:
    patch:
      summary: Ativar ou desativar a unidade autenticada
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ativa]
              properties:
                ativa: { type: boolean }
      responses:
        '200': { description: Situação operacional atualizada. }
        '403': { description: Ator não pertence à unidade correspondente. }
        '409': { description: "`Idempotency-Key` reutilizada com conteúdo diferente." }
  /unidade/prazo-analise:
    put:
      summary: Atualizar prazo de análise da unidade autenticada
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prazoAnaliseHoras]
              properties:
                prazoAnaliseHoras: { type: integer, minimum: 1 }
      responses:
        '200': { description: Prazo atualizado; reservas existentes mantêm o prazo aplicado. }
        '403': { description: Ator não pertence à unidade correspondente. }
        '409': { description: "`Idempotency-Key` reutilizada com conteúdo diferente." }
  /painel/estoque/{unidadeId}/itens/{itemId}/permissao:
    put:
      summary: Configurar se o item permite reserva
      description: Encaminha ao Estoque; quando a relação unidade/item ainda não existe, inicializa saldo físico e alocado em zero.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: unidadeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permiteReserva]
              properties:
                permiteReserva: { type: boolean }
      responses:
        '200': { description: Configuração atualizada. }
        '403': { description: Ator sem permissão para a unidade. }
        '404': { description: Item ou saldo não encontrado. }
        '409': { description: "`Idempotency-Key` reutilizada com conteúdo diferente." }
  /painel/estoque/catalogo:
    get:
      summary: Listar catálogo para entrada de estoque
      description: Identifica a unidade vinculada ao profissional e lista os itens do catálogo, inclusive os que ainda não têm saldo na unidade.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Unidade vinculada e itens disponíveis para seleção.
          content:
            application/json:
              schema:
                type: object
                required: [unidadeId, itens]
                properties:
                  unidadeId: { type: string, format: uuid }
                  itens:
                    type: array
                    items:
                      type: object
                      required: [itemId, nome, tipo]
                      properties:
                        itemId: { type: string, format: uuid }
                        nome: { type: string }
                        tipo: { type: string, enum: [MEDICAMENTO, INSUMO] }
                        descricao: { type: string }
        '401': { description: Credencial ausente ou inválida. }
        '403': { description: Operação exclusiva de profissional da unidade. }
  /painel/estoque/{unidadeId}/itens/{itemId}/entradas:
    post:
      summary: Registrar entrada de estoque
      description: O profissional vinculado à unidade seleciona um item do catálogo e informa a quantidade recebida. A entrada pode criar o primeiro saldo do item na unidade.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: unidadeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantidade]
              properties:
                quantidade: { type: integer, minimum: 1, maximum: 2147483647 }
                motivo: { type: string, minLength: 1, default: Entrada de estoque }
      responses:
        '201':
          description: Entrada registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovimentacaoResumo' }
        '401': { description: Credencial ausente ou inválida. }
        '403': { description: Ator sem permissão para a unidade. }
        '404': { description: Unidade ativa ou item do catálogo não encontrado. }
        '409': { description: CHAVE_IDEMPOTENTE_CONFLITANTE ou LIMITE_ESTOQUE_EXCEDIDO. }
        '422': { description: Quantidade ou chave idempotente inválida. }
        '503': { description: Banco de Estoque indisponível ou validação de unidade indisponível. }
  /painel/estoque/{unidadeId}/itens/{itemId}/ajustes:
    post:
      summary: Ajustar saldo físico
      security: [{ bearerAuth: [] }]
      parameters:
        - name: unidadeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variacaoFisica, motivo]
              properties:
                variacaoFisica:
                  oneOf:
                    - { type: integer, maximum: -1 }
                    - { type: integer, minimum: 1 }
                motivo: { type: string, minLength: 1 }
      responses:
        '201':
          description: Ajuste registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovimentacaoResumo' }
        '403': { description: Ator sem permissão para a unidade. }
        '409': { description: Ajuste reduz o físico abaixo das alocações ativas ou chave idempotente conflitante. }
  /reservas/{reservaId}/decisao:
    post:
      summary: Aceitar ou rejeitar uma solicitação
      operationId: decidirSolicitacao
      description: >-
        O BFF consulta o resultado da operação de decisão em Reservas com a
        chave e a identidade do profissional. REJEITAR é aplicado ali. Para
        ACEITAR, somente o encaminhamento conclusivo ACEITE_ENCAMINHAR
        autoriza o BFF a chamar o Orquestrador com a mesma chave. O status 202 confirma a gravação
        do pedido para processamento. Consulte Location para o estado da reserva.
        A mesma chave e conteúdo recuperam a resposta original.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reservaId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisao]
              properties:
                decisao: { type: string, enum: [ACEITAR, REJEITAR] }
      responses:
        '200':
          description: "Rejeição registrada em Reservas."
        '202':
          description: "Aceite registrado pelo Orquestrador para processamento."
          headers:
            Location:
              description: "Caminho público para acompanhar o estado de negócio, /api/unidade/v1/painel/reservas/{reservaId}."
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoEmProcessamento' }
        '400':
          description: "Entrada inválida ou cabeçalho obrigatório ausente."
        '401':
          description: "Credencial ausente ou inválida."
        '403':
          description: "Chamador ou ator sem permissão."
        '404':
          description: "Recurso não encontrado."
        '409':
          description: "Transição incompatível, execução concorrente ou chave usada com outro conteúdo."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroComando' }
        '503':
          description: "Serviço temporariamente indisponível. Repita o comando com a mesma chave e conteúdo quando o resultado estiver incerto."
  /reservas/{reservaId}/cancelar:
    post:
      summary: Solicitar cancelamento da reserva pela unidade
      operationId: solicitarCancelamentoReserva
      description: >-
        O BFF chama primeiro o cancelamento local condicional em Reservas.
        O código CANCELAMENTO_DISTRIBUIDO seleciona o Orquestrador. Reservas
        persiste esse encaminhamento idempotente, para que uma repetição use o
        mesmo destino mesmo após a mudança de estado. É usada a mesma chave
        e o mesmo conteúdo a cada repetição em cada serviço. Outros conflitos
        ou um resultado incerto em Reservas não permitem redirecionar. A justificativa do profissional é obrigatória e deve ter ao menos cinco caracteres após remover espaços externos.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reservaId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [justificativa]
              properties:
                justificativa: { type: string, minLength: 5 }
      responses:
        '200':
          description: "Cancelamento local concluído em Reservas."
        '202':
          description: "Cancelamento distribuído registrado para processamento. Consulte Location para acompanhar o estado da reserva."
          headers:
            Location:
              description: "Caminho público para acompanhar o estado de negócio, /api/unidade/v1/painel/reservas/{reservaId}."
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoEmProcessamento' }
        '400':
          description: "Entrada inválida ou cabeçalho obrigatório ausente."
        '401':
          description: "Credencial ausente ou inválida."
        '403':
          description: "Chamador ou ator sem permissão."
        '404':
          description: "Recurso não encontrado."
        '409':
          description: "Cancelamento não permitido, em andamento com outro pedido ou chave usada com conteúdo diferente."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroComando' }
        '503':
          description: "Serviço temporariamente indisponível. Repita o comando com a mesma chave e conteúdo quando o resultado estiver incerto."
  /retiradas:
    post:
      summary: Registrar entrega presencial
      description: Encaminha o registro ao serviço Retiradas, que valida a reserva canônica e revalida a autorização.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [autorizacaoId]
              properties:
                autorizacaoId: { type: string, format: uuid }
      responses:
        '201':
          description: Entrega registrada; a repetição com a mesma chave reproduz o resultado original.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetiradaRegistrada' }
        '409': { description: "Autorização inexistente, cancelada ou já utilizada, reserva sem estado CONFIRMADA ou `Idempotency-Key` reutilizada com conteúdo diferente." }
        '503': { description: Não foi possível consultar o estado canônico; nenhuma nova entrega foi registrada. }
  /painel/reservas:
    get:
      summary: Listar solicitações pendentes da unidade autenticada
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Reservas SOLICITADA que aguardam decisão da unidade, em vista resumida.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReservaPainel' }
        '403': { description: Profissional sem unidade vinculada. }
  /painel/reservas/{reservaId}:
    get:
      summary: Consultar reserva agregada para a unidade
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reservaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Vista operacional composta com dados da reserva, estoque e autorização.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservaPainel' }
        '403': { description: Profissional sem acesso à unidade da reserva. }
        '404': { description: Reserva não encontrada. }
  /painel/estoque:
    get:
      summary: Consultar estoque operacional da unidade
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista de itens com saldo e instante da projeção apresentada.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EstoquePainelItem' }
