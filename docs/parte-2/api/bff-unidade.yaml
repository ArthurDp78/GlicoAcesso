openapi: 3.0.3
info:
  title: BFF Unidade
  version: "1.0.0"
  description: Agrega informações operacionais para o staff da unidade de saúde.
servers:
  - url: /api/unidade/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
paths:
  /painel/reservas/{reservaId}:
    get:
      summary: Consultar reserva agregada (Operacional)
      security:
        - bearerAuth: []
      parameters:
        - name: reservaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Vista completa com dados operacionais e de alocação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservaId: { type: string, format: uuid }
                  status: { type: string }
                  itemNome: { type: string }
                  estoqueFisicoAtual: { type: integer }
                  dadosAlocacao:
                    type: object
                    properties:
                      alocacaoId: { type: string, format: uuid }
                      quantidadeReservada: { type: integer }
                  _links:
                    type: object
  /painel/estoque:
    get:
      summary: Consultar lista de stock real da unidade
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de itens com quantidades canónicas e configuração de reservas.openapi: 3.0.0
info:
  title: BFF Unidade
  version: "1.0"
  description: Backend For Frontend para o sistema desktop utilizado pelos profissionais das unidades de saúde.
servers:
  - url: /api/unidade/v1
paths:
  /reservas/{reservaId}:
    get:
      summary: Consultar detalhes da reserva (Agregado Operacional)
      description: O BFF consulta Reservas, Estoque e Retiradas para montar uma vista completa, incluindo alocações e ações administrativas.
      parameters:
        - name: reservaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes da reserva formatados para a equipa da Unidade.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservaId: { type: string, format: uuid }
                  status: { type: string }
                  item:
                    type: object
                    properties:
                      itemId: { type: string, format: uuid }
                      nome: { type: string }
                      estoqueFisicoAtual: { type: integer }
                  alocacao:
                    type: object
                    properties:
                      alocacaoId: { type: string, format: uuid }
                      quantidade: { type: integer }
                  acoesAdministrativas:
                    type: array
                    items:
                      type: string