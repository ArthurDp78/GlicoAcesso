openapi: 3.0.0
info:
  title: BFF Unidade
  version: "1.0"
  description: Backend For Frontend para o sistema desktop utilizado pelos profissionais das unidades de saúde.
servers:
  - url: /api/unidade/v1
paths:
  /reservas/{reservaId}:
    get:
      summary: Consultar detalhes da reserva (Agregado Operacional)
      description: O BFF consulta Reservas, Estoque e Retiradas para montar uma vista completa, incluindo alocações e ações administrativas.
      parameters:
        - name: reservaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes da reserva formatados para a equipa da Unidade.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservaId: { type: string, format: uuid }
                  status: { type: string }
                  item:
                    type: object
                    properties:
                      itemId: { type: string, format: uuid }
                      nome: { type: string }
                      estoqueFisicoAtual: { type: integer }
                  alocacao:
                    type: object
                    properties:
                      alocacaoId: { type: string, format: uuid }
                      quantidade: { type: integer }
                  acoesAdministrativas:
                    type: array
                    items:
                      type: string