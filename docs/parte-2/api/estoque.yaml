openapi: 3.0.3
info:
  title: API de Estoque
  version: "1.1.0"
  description: Catálogo, saldo físico, movimentações, alocações e projeção de disponibilidade.
servers:
  - url: /
components:
  securitySchemes:
    serviceAuth:
      type: http
      scheme: bearer
      description: >-
        Credencial própria do serviço ou BFF chamador, verificada pelo destinatário.
        A identidade do ator só é aceita nos cabeçalhos X-Ator-* acompanhados da
        credencial de um chamador autorizado a delegá-la: o BFF Cidadão delega
        somente CIDADAO, o BFF Unidade somente PROFISSIONAL e o Orquestrador os
        atores dos pedidos que persistiu. O token do usuário não é aceito aqui.
    atorPapel:
      type: apiKey
      in: header
      name: X-Ator-Papel
      description: CIDADAO ou PROFISSIONAL. Nunca aceito diretamente do cliente.
    atorId:
      type: apiKey
      in: header
      name: X-Ator-Id
      description: Identificador estável do ator autenticado pelo BFF.
    atorUnidade:
      type: apiKey
      in: header
      name: X-Ator-Unidade-Id
      description: Unidade vinculada ao profissional. Obrigatório para PROFISSIONAL.
    adminAuth:
      type: http
      scheme: bearer
      description: Credencial interna da autoridade administrativa, sem rota nos BFFs.
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
    SagaIdHeader:
      name: X-Saga-Id
      in: header
      required: true
      description: Identificador da execução que solicitou o comando.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave estável para repetir o mesmo comando com o mesmo resultado.
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    ErroComando:
      type: object
      required: [codigo]
      properties:
        codigo: { type: string }
        mensagem: { type: string }
    Item:
      type: object
      required: [itemId, nome, tipo]
      properties:
        itemId: { type: string, format: uuid }
        nome: { type: string, minLength: 1 }
        tipo: { type: string, enum: [MEDICAMENTO, INSUMO] }
        descricao: { type: string }
    Alocacao:
      type: object
      required: [alocacaoId, reservaId, sagaId, unidadeId, itemId, quantidade]
      properties:
        alocacaoId: { type: string, format: uuid }
        reservaId: { type: string, format: uuid }
        sagaId: { type: string, format: uuid }
        unidadeId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        quantidade: { type: integer, minimum: 1 }
    MovimentacaoEstoque:
      type: object
      required: [movimentacaoId, unidadeId, itemId, variacaoFisica, ocorridaEm, estoqueVersion]
      properties:
        movimentacaoId: { type: string, format: uuid }
        unidadeId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        variacaoFisica: { type: integer }
        ocorridaEm: { type: string, format: date-time }
        estoqueVersion: { type: integer, format: int64, minimum: 0 }
    DisponibilidadeItem:
      type: object
      required: [itemId, unidadeId, quantidadeDisponivel, permiteReserva, atualizadoEm]
      properties:
        itemId: { type: string, format: uuid }
        unidadeId: { type: string, format: uuid }
        quantidadeDisponivel: { type: integer, minimum: 0 }
        permiteReserva: { type: boolean }
        atualizadoEm:
          type: string
          format: date-time
          description: Instante do estado refletido pela projeção, não o horário da consulta.
    PermissaoReserva:
      type: object
      required: [unidadeId, itemId, permiteReserva]
      properties:
        unidadeId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        permiteReserva: { type: boolean }
    EstoqueUnidadeItem:
      type: object
      required: [itemId, unidadeId, itemNome, estoqueFisicoAtual, quantidadeAlocada, quantidadeDisponivel, permiteReserva, atualizadoEm]
      properties:
        itemId: { type: string, format: uuid }
        unidadeId: { type: string, format: uuid }
        itemNome: { type: string }
        estoqueFisicoAtual: { type: integer, minimum: 0 }
        quantidadeAlocada: { type: integer, minimum: 0 }
        quantidadeDisponivel: { type: integer, minimum: 0 }
        permiteReserva: { type: boolean }
        atualizadoEm: { type: string, format: date-time }
paths:
  /api/cidadao/v1/estoque/itens:
    get:
      summary: Listar catálogo público de itens
      responses:
        '200':
          description: Itens para seleção na consulta de disponibilidade, sem dados de saldo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Item' }
  /api/cidadao/v1/estoque/disponibilidade:
    get:
      summary: Consultar disponibilidade projetada
      parameters:
        - name: unidadeId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: itemId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Disponibilidade informativa; alocação valida o saldo canônico.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisponibilidadeItem' }
        '404': { description: Combinação de unidade e item sem projeção. }
        '422': { description: "Parâmetro, cabeçalho ou corpo inválido." }
  /api/unidade/v1/estoque/itens:
    get:
      summary: Listar catálogo de itens
      security: [{ serviceAuth: [], atorPapel: [], atorId: [], atorUnidade: [] }]
      responses:
        '200':
          description: Catálogo canônico de medicamentos e insumos.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Item' }
        '401': { description: Credencial ausente ou inválida. }
        '403': { description: Chamador ou ator sem permissão. }
  /api/unidade/v1/estoque/{unidadeId}/itens:
    get:
      summary: Consultar catálogo e saldos projetados de uma unidade
      security: [{ serviceAuth: [], atorPapel: [], atorId: [], atorUnidade: [] }]
      parameters:
        - name: unidadeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Itens e disponibilidade com o instante da projeção aplicado.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EstoqueUnidadeItem' }
        '403': { description: Ator sem acesso à unidade. }
        '401': { description: Credencial ausente ou inválida. }
        '422': { description: "Parâmetro, cabeçalho ou corpo inválido." }
  /internal/v1/unidades/{unidadeId}/itens/{itemId}/permissao-reserva:
    get:
      summary: Consultar permissão canônica de reserva
      description: Leitura do modelo de escrita usada por Reservas ao criar uma solicitação; não depende da projeção de disponibilidade.
      security: [{ serviceAuth: [] }]
      parameters:
        - name: unidadeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Permissão atual da combinação unidade/item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissaoReserva' }
        '404': { description: "Unidade, item ou configuração de saldo não encontrada." }
        '503': { description: Modelo canônico de Estoque indisponível. }
        '401': { description: Credencial ausente ou inválida. }
        '403': { description: Chamador ou ator sem permissão. }
        '422': { description: "Parâmetro, cabeçalho ou corpo inválido." }
  /internal/v1/itens:
    post:
      summary: Cadastrar item no catálogo
      security: [{ adminAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nome, tipo]
              properties:
                nome: { type: string, minLength: 1 }
                tipo: { type: string, enum: [MEDICAMENTO, INSUMO] }
                descricao: { type: string }
      responses:
        '201':
          description: Item cadastrado; a repetição idêntica reproduz a resposta original.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '409': { description: Chave idempotente reutilizada com conteúdo diferente (CHAVE_IDEMPOTENTE_CONFLITANTE) ou item com mesmo nome e tipo (CADASTRO_CONFLITANTE). }
        '401': { description: Credencial ausente ou inválida. }
        '403': { description: Chamador ou ator sem permissão. }
        '422': { description: "Parâmetro, cabeçalho ou corpo inválido." }
  /internal/v1/itens/{itemId}:
    put:
      summary: Atualizar cadastro de item
      security: [{ adminAuth: [] }]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nome, tipo]
              properties:
                nome: { type: string, minLength: 1 }
                tipo: { type: string, enum: [MEDICAMENTO, INSUMO] }
                descricao: { type: string }
      responses:
        '200': { description: Cadastro do item atualizado. }
        '404': { description: Item não encontrado. }
        '409': { description: Chave idempotente reutilizada com conteúdo diferente (CHAVE_IDEMPOTENTE_CONFLITANTE) ou item com mesmo nome e tipo (CADASTRO_CONFLITANTE). }
        '401': { description: Credencial ausente ou inválida. }
        '403': { description: Chamador ou ator sem permissão. }
        '422': { description: "Parâmetro, cabeçalho ou corpo inválido." }
  /api/unidade/v1/estoque/{unidadeId}/itens/{itemId}/permissao:
    put:
      summary: Configurar se item permite reserva
      description: Atualiza a permissão do saldo existente ou inicializa a relação unidade/item com saldo físico e alocado iguais a zero antes de aplicar a configuração.
      security: [{ serviceAuth: [], atorPapel: [], atorId: [], atorUnidade: [] }]
      parameters:
        - name: unidadeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [permiteReserva]
              properties:
                permiteReserva: { type: boolean }
      responses:
        '200': { description: Configuração atualizada. }
        '401': { description: Não autenticado. }
        '403': { description: Sem permissão para a unidade. }
        '404': { description: Item não encontrado. }
        '409': { description: Chave idempotente reutilizada com conteúdo diferente. }
        '422': { description: "Parâmetro, cabeçalho ou corpo inválido." }
  /api/unidade/v1/estoque/{unidadeId}/itens/{itemId}/entradas:
    post:
      summary: Registrar entrada física no estoque
      security: [{ serviceAuth: [], atorPapel: [], atorId: [], atorUnidade: [] }]
      parameters:
        - name: unidadeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quantidade, motivo]
              properties:
                quantidade: { type: integer, minimum: 1 }
                motivo: { type: string, minLength: 1 }
      responses:
        '201':
          description: Entrada, movimento e evento de projeção registrados atomicamente; repetição idêntica reproduz a resposta original.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovimentacaoEstoque' }
        '403': { description: Ator sem permissão para a unidade. }
        '404': { description: "Item ou saldo da unidade não encontrado." }
        '409': { description: Chave idempotente reutilizada com conteúdo diferente. }
        '401': { description: Credencial ausente ou inválida. }
        '422': { description: "Parâmetro, cabeçalho ou corpo inválido." }
  /api/unidade/v1/estoque/{unidadeId}/itens/{itemId}/ajustes:
    post:
      summary: Ajustar saldo físico por variação
      description: Variação positiva acrescenta saldo; negativa reduz saldo. O ajuste não pode reduzir o físico abaixo da quantidade já alocada.
      security: [{ serviceAuth: [], atorPapel: [], atorId: [], atorUnidade: [] }]
      parameters:
        - name: unidadeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [variacaoFisica, motivo]
              properties:
                variacaoFisica:
                  oneOf:
                    - { type: integer, maximum: -1 }
                    - { type: integer, minimum: 1 }
                motivo: { type: string, minLength: 1 }
      responses:
        '201':
          description: Ajuste, movimento e evento de projeção registrados atomicamente; repetição idêntica reproduz a resposta original.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovimentacaoEstoque' }
        '403': { description: Ator sem permissão para a unidade. }
        '404': { description: "Item ou saldo da unidade não encontrado." }
        '409': { description: Ajuste incompatível com alocações ativas ou chave reutilizada com conteúdo diferente. }
        '401': { description: Credencial ausente ou inválida. }
        '422': { description: "Parâmetro, cabeçalho ou corpo inválido." }
  /internal/v1/alocacoes:
    post:
      summary: Alocar estoque para a SAGA
      operationId: alocarEstoque
      description: >-
        Somente o Orquestrador. Valida permissão e saldo no modelo de escrita.
        Estoque grava o efeito e o resultado idempotente na mesma transação.
        Repetição com a mesma chave e conteúdo reproduz o resultado conclusivo.
      security: [{ serviceAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sagaId, reservaId, unidadeId, itemId, quantidade]
              properties:
                sagaId: { type: string, format: uuid }
                reservaId: { type: string, format: uuid }
                unidadeId: { type: string, format: uuid }
                itemId: { type: string, format: uuid }
                quantidade: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Alocação criada; resposta repetida reproduz o resultado original.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alocacao' }
        '409':
          description: "SALDO_INSUFICIENTE, RESERVA_NAO_PERMITIDA, ALOCACAO_INCOMPATIVEL ou CHAVE_IDEMPOTENTE_CONFLITANTE. A recusa de saldo ou permissão indica que o comando não criou alocação."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroComando' }
        '404':
          description: "Item ou saldo da unidade não encontrado. Nenhuma alocação foi criada."
        '400':
          description: "Entrada inválida ou cabeçalho obrigatório ausente."
        '401':
          description: "Credencial ausente ou inválida."
        '403':
          description: "Operação restrita ao Orquestrador."
        '503':
          description: "Serviço temporariamente indisponível. Repita o comando com a mesma chave e conteúdo quando o resultado estiver incerto."
  /internal/v1/alocacoes/{reservaId}:
    delete:
      summary: Liberar alocação (compensação SAGA)
      operationId: liberarAlocacao
      description: >-
        Somente o Orquestrador, para compensação ou cancelamento. O sagaId identifica a execução que solicita a liberação. A alocação é localizada pelo reservaId. A liberação nunca altera saldo físico nem reabre alocação consumida.
        Repetições idênticas devolvem o resultado conclusivo gravado.
      security: [{ serviceAuth: [] }]
      parameters:
        - name: reservaId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/SagaIdHeader' }
        - { $ref: '#/components/parameters/CorrelationId' }
      responses:
        '204':
          description: "Liberação confirmada ou ausência de alocação ativa a liberar, incluindo alocação já liberada."
        '409':
          description: "ALOCACAO_CONSUMIDA ou CHAVE_IDEMPOTENTE_CONFLITANTE. Nenhuma alocação é reaberta."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroComando' }
        '400':
          description: "Entrada inválida ou cabeçalho obrigatório ausente."
        '401':
          description: "Credencial ausente ou inválida."
        '403':
          description: "Operação restrita ao Orquestrador."
        '503':
          description: "Serviço temporariamente indisponível. Repita o comando com a mesma chave e conteúdo quando o resultado estiver incerto."
