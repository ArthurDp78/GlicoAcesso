openapi: 3.0.3
info:
  title: API de Estoque
  version: "1.0.0"
  description: Catálogo, saldo físico, alocações e projeção de disponibilidade.
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    DisponibilidadeItem:
      type: object
      properties:
        itemId: { type: string, format: uuid }
        unidadeId: { type: string, format: uuid }
        quantidadeDisponivel: { type: integer }
        permiteReserva: { type: boolean }
        atualizadoEm: { type: string, format: date-time }
paths:
  /api/cidadao/v1/estoque/disponibilidade:
    get:
      summary: Consulta de disponibilidade (Projeção)
      parameters:
        - name: unidadeId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: itemId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisponibilidadeItem'
  /api/unidade/v1/estoque/{unidadeId}/itens/{itemId}/permissao:
    put:
      summary: Configurar se item permite reserva
      security:
        - bearerAuth: []
      parameters:
        - name: unidadeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permiteReserva: { type: boolean }
      responses:
        '200':
          description: Configuração atualizada.
        '401':
          description: Não autenticado.
        '403':
          description: Sem permissão.
  /internal/v1/alocacoes:
    post:
      summary: Alocar Estoque (SAGA)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sagaId: { type: string, format: uuid }
                reservaId: { type: string, format: uuid }
                unidadeId: { type: string, format: uuid }
                itemId: { type: string, format: uuid }
                quantidade: { type: integer, minimum: 1 }
                idempotencyKey: { type: string }
      responses:
        '201':
          description: Alocação criada/confirmada.
        '409':
          description: Saldo insuficiente ou conflito.
  /internal/v1/alocacoes/{reservaId}:
    delete:
      summary: Liberar Alocação (Compensação SAGA)
      parameters:
        - name: reservaId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Alocação libertada de forma idempotente.