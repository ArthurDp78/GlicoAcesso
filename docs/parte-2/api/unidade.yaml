openapi: 3.0.3
info:
  title: API de Unidades
  version: "1.0.0"
  description: Cadastro, atendimento, horários e prazos de análise das unidades.
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    gestorRedeAuth:
      type: http
      scheme: bearer
      description: Credencial exclusiva do gestor da rede, usada pelo comando administrativo na rede interna.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave estável para repetir o mesmo comando com o mesmo resultado.
      schema: { type: string, minLength: 1 }
    CadastroIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave opaca do cadastro. Reutilize-a com o mesmo conteúdo ao repetir a operação.
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    ErroCadastro:
      type: object
      required: [codigo, mensagem]
      properties:
        codigo: { type: string, enum: [CHAVE_IDEMPOTENTE_CONFLITANTE, CADASTRO_DUPLICADO] }
        mensagem: { type: string }
    Horario:
      type: object
      required: [diaSemana, horarioInicial, horarioFinal]
      properties:
        diaSemana: { type: integer, minimum: 1, maximum: 7 }
        horarioInicial: { type: string, format: time }
        horarioFinal: { type: string, format: time }
    Unidade:
      type: object
      required: [unidadeId, nome, endereco, horarioAtendimento, orientacoesRetirada, contatos, horarios, prazoAnaliseHoras, ativa]
      properties:
        unidadeId: { type: string, format: uuid }
        nome: { type: string, minLength: 1 }
        endereco: { type: string }
        horarioAtendimento: { type: string }
        orientacoesRetirada: { type: string, minLength: 1, description: Orientações públicas sobre requisitos e documentos para retirada. }
        contatos:
          type: array
          items:
            type: object
            required: [tipo, valor]
            properties:
              tipo: { type: string, minLength: 1 }
              valor: { type: string, minLength: 1 }
        horarios:
          type: array
          items: { $ref: '#/components/schemas/Horario' }
        prazoAnaliseHoras: { type: integer, minimum: 1 }
        ativa: { type: boolean }
    UnidadeResumo:
      type: object
      required: [unidadeId, nome, endereco, horarioAtendimento, orientacoesRetirada]
      properties:
        unidadeId: { type: string, format: uuid }
        nome: { type: string }
        endereco: { type: string }
        horarioAtendimento: { type: string }
        orientacoesRetirada: { type: string, minLength: 1 }
    UnidadeInput:
      type: object
      required: [nome, logradouro, numero, bairro, cidade, estado, cep, orientacoesRetirada, contatos, horarios, prazoAnaliseHoras]
      properties:
        nome: { type: string, minLength: 1 }
        logradouro: { type: string, minLength: 1 }
        numero: { type: string, minLength: 1 }
        bairro: { type: string, minLength: 1 }
        cidade: { type: string, minLength: 1 }
        estado: { type: string, minLength: 1 }
        cep: { type: string, minLength: 1 }
        orientacoesRetirada: { type: string, minLength: 1 }
        contatos:
          type: array
          items:
            type: object
            required: [tipo, valor]
            properties:
              tipo: { type: string, minLength: 1 }
              valor: { type: string, minLength: 1 }
        horarios:
          type: array
          items: { $ref: '#/components/schemas/Horario' }
        prazoAnaliseHoras: { type: integer, minimum: 1, maximum: 720 }
paths:
  /api/cidadao/v1/unidades:
    get:
      summary: Listar unidades disponíveis
      responses:
        '200':
          description: Unidades ativas para consulta.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UnidadeResumo' }
  /internal/v1/unidades:
    post:
      summary: Cadastrar unidade
      description: >-
        Operação exclusiva do gestor da rede. Cadastra a unidade ativa junto
        com horários e contatos. A combinação de nome, logradouro, número,
        bairro, cidade, estado e CEP identifica duplicidades, inclusive de
        unidades inativas. A comparação ignora caixa e espaços nas bordas
        dos campos. O CEP aceita oito dígitos com hífen opcional antes dos
        últimos três. Cada horário termina depois de começar no mesmo dia.
      security: [{ gestorRedeAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CadastroIdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/UnidadeInput' }
                - type: object
                  properties:
                    nome: { type: string, maxLength: 120 }
                    logradouro: { type: string, maxLength: 120 }
                    numero: { type: string, maxLength: 40 }
                    bairro: { type: string, maxLength: 120 }
                    cidade: { type: string, maxLength: 120 }
                    estado: { type: string, maxLength: 40 }
                    cep: { type: string, pattern: '^[0-9]{5}-?[0-9]{3}$' }
                    prazoAnaliseHoras: { type: integer, minimum: 1, maximum: 720 }
                    contatos:
                      type: array
                      uniqueItems: true
                      items:
                        type: object
                        properties:
                          tipo: { type: string, maxLength: 40 }
                          valor: { type: string, maxLength: 400 }
                    horarios: { type: array, uniqueItems: true }
      responses:
        '201':
          description: Unidade cadastrada; a repetição idêntica reproduz a resposta original.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Unidade' }
        '401': { description: Credencial do gestor ausente ou inválida. }
        '409':
          description: CHAVE_IDEMPOTENTE_CONFLITANTE indica conteúdo diferente para a mesma chave. CADASTRO_DUPLICADO indica que o cadastro já existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroCadastro' }
        '422': { description: Dados de cadastro inválidos ou chave idempotente ausente ou inválida. }
        '503': { description: Credencial do gestor sem configuração ou banco indisponível. }
  /internal/v1/unidades/{unidadeId}:
    get:
      summary: Consultar cadastro completo da unidade
      security: [{ bearerAuth: [] }]
      parameters:
        - name: unidadeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Cadastro, contatos, horários e prazo vigente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Unidade' }
        '404': { description: Unidade não encontrada. }
    put:
      summary: Atualizar cadastro e informações de atendimento da unidade
      security: [{ bearerAuth: [] }]
      parameters:
        - name: unidadeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnidadeInput' }
      responses:
        '200': { description: Cadastro atualizado. }
        '404': { description: Unidade não encontrada. }
        '409': { description: Chave idempotente reutilizada com conteúdo diferente. }
  /internal/v1/unidades/{unidadeId}/horarios:
    put:
      summary: Substituir horários de atendimento da unidade
      security: [{ bearerAuth: [] }]
      parameters:
        - name: unidadeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [horarios]
              properties:
                horarios:
                  type: array
                  items: { $ref: '#/components/schemas/Horario' }
      responses:
        '200': { description: Horários substituídos. }
        '404': { description: Unidade não encontrada. }
        '409': { description: Chave idempotente reutilizada com conteúdo diferente. }
  /internal/v1/unidades/{unidadeId}/status:
    patch:
      summary: Ativar ou desativar a unidade
      security: [{ bearerAuth: [] }]
      parameters:
        - name: unidadeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ativa]
              properties:
                ativa: { type: boolean }
      responses:
        '200': { description: Situação operacional atualizada; cadastro e referências históricas são preservados. }
        '404': { description: Unidade não encontrada. }
        '409': { description: Chave idempotente reutilizada com conteúdo diferente. }
  /internal/v1/unidades/{unidadeId}/prazo-analise:
    get:
      summary: Obter prazo de análise para Reservas
      security: [{ bearerAuth: [] }]
      parameters:
        - name: unidadeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '422': { description: Prazo legado acima de 720 horas. Atualize o cadastro. }
        '200':
          description: Prazo vigente.
          content:
            application/json:
              schema:
                type: object
                required: [prazoAnaliseHoras]
                properties:
                  prazoAnaliseHoras: { type: integer, minimum: 1, maximum: 720 }
        '404': { description: Unidade não encontrada ou inativa. }
    put:
      summary: Configurar prazo de análise
      security: [{ bearerAuth: [] }]
      parameters:
        - name: unidadeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prazoAnaliseHoras]
              properties:
                prazoAnaliseHoras: { type: integer, minimum: 1, maximum: 720 }
      responses:
        '200': { description: Prazo atualizado; reservas existentes mantêm o prazo já aplicado. }
        '404': { description: Unidade não encontrada. }
        '409': { description: Chave idempotente reutilizada com conteúdo diferente. }
