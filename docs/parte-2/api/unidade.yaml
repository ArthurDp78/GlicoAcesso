openapi: 3.0.3
info:
  title: API de Unidades
  version: "1.0.0"
  description: Cadastro, atendimento, horários e prazos de análise das unidades.
servers:
  - url: /
components:
  securitySchemes:
    serviceAuth:
      type: http
      scheme: bearer
      description: >-
        Credencial própria do serviço ou BFF chamador, verificada pelo destinatário.
        A identidade do ator só é aceita nos cabeçalhos X-Ator-* acompanhados da
        credencial de um chamador autorizado a delegá-la: o BFF Cidadão delega
        somente CIDADAO, o BFF Unidade somente PROFISSIONAL e o Orquestrador os
        atores dos pedidos que persistiu. O token do usuário não é aceito aqui.
    atorPapel:
      type: apiKey
      in: header
      name: X-Ator-Papel
      description: CIDADAO ou PROFISSIONAL. Nunca aceito diretamente do cliente.
    atorId:
      type: apiKey
      in: header
      name: X-Ator-Id
      description: Identificador estável do ator autenticado pelo BFF.
    atorUnidade:
      type: apiKey
      in: header
      name: X-Ator-Unidade-Id
      description: Unidade vinculada ao profissional. Obrigatório para PROFISSIONAL.
    adminAuth:
      type: http
      scheme: bearer
      description: Credencial interna da autoridade administrativa, sem rota nos BFFs.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave estável para repetir o mesmo comando com o mesmo resultado.
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    Horario:
      type: object
      additionalProperties: false
      description: >-
        Período de atendimento em horário local, sem fuso. horarioInicial deve
        ser estritamente anterior a horarioFinal no mesmo dia. Duração nula e
        períodos que atravessem ou terminem à meia-noite são inválidos.
      required: [diaSemana, horarioInicial, horarioFinal]
      properties:
        diaSemana: { type: integer, minimum: 1, maximum: 7 }
        horarioInicial: { type: string, format: time }
        horarioFinal: { type: string, format: time }
    Unidade:
      type: object
      required: [unidadeId, nome, endereco, horarioAtendimento, orientacoesRetirada, contatos, horarios, prazoAnaliseHoras, ativa]
      properties:
        unidadeId: { type: string, format: uuid }
        nome: { type: string, minLength: 1 }
        endereco: { type: string }
        horarioAtendimento: { type: string }
        orientacoesRetirada: { type: string, minLength: 1, description: Orientações públicas sobre requisitos e documentos para retirada. }
        contatos:
          type: array
          items:
            type: object
            required: [tipo, valor]
            properties:
              tipo: { type: string, minLength: 1 }
              valor: { type: string, minLength: 1 }
        horarios:
          type: array
          items: { $ref: '#/components/schemas/Horario' }
        prazoAnaliseHoras: { type: integer, minimum: 1 }
        ativa: { type: boolean }
    UnidadeResumo:
      type: object
      required: [unidadeId, nome, endereco, horarioAtendimento, orientacoesRetirada]
      properties:
        unidadeId: { type: string, format: uuid }
        nome: { type: string }
        endereco: { type: string }
        horarioAtendimento: { type: string }
        orientacoesRetirada: { type: string, minLength: 1 }
    UnidadeInput:
      type: object
      additionalProperties: false
      required: [nome, logradouro, numero, bairro, cidade, estado, cep, orientacoesRetirada, contatos, horarios, prazoAnaliseHoras]
      properties:
        nome: { type: string, minLength: 1 }
        logradouro: { type: string, minLength: 1 }
        numero: { type: string, minLength: 1 }
        bairro: { type: string, minLength: 1 }
        cidade: { type: string, minLength: 1 }
        estado: { type: string, minLength: 1 }
        cep: { type: string, minLength: 1 }
        orientacoesRetirada: { type: string, minLength: 1 }
        contatos:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [tipo, valor]
            properties:
              tipo: { type: string, minLength: 1 }
              valor: { type: string, minLength: 1 }
        horarios:
          type: array
          description: Períodos do mesmo dia não podem se sobrepor nem se repetir. Períodos consecutivos e horários iguais em dias diferentes são permitidos.
          items: { $ref: '#/components/schemas/Horario' }
        prazoAnaliseHoras: { type: integer, minimum: 1, maximum: 720 }
paths:
  /api/cidadao/v1/unidades:
    get:
      summary: Listar unidades disponíveis
      responses:
        '200':
          description: Unidades ativas para consulta.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UnidadeResumo' }
  /internal/v1/unidades:
    post:
      summary: Cadastrar unidade
      security: [{ adminAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnidadeInput' }
      responses:
        '201':
          description: Unidade cadastrada; a repetição idêntica reproduz a resposta original.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Unidade' }
        '409': { description: Chave idempotente reutilizada com conteúdo diferente (CHAVE_IDEMPOTENTE_CONFLITANTE) ou unidade com mesmo nome e endereço (CADASTRO_CONFLITANTE). }
        '422': { description: "Dados inválidos, inclusive período de atendimento inválido ou sobreposto. Nenhuma alteração é persistida." }
        '401': { description: Credencial ausente ou inválida. }
        '403': { description: Chamador ou ator sem permissão. }
  /internal/v1/unidades/{unidadeId}:
    get:
      summary: Consultar cadastro completo da unidade
      security: [{ serviceAuth: [] }, { serviceAuth: [], atorPapel: [], atorId: [], atorUnidade: [] }]
      parameters:
        - name: unidadeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: >-
            Cadastro completo para Reservas e para o profissional da unidade. O BFF
            Cidadão recebe somente os campos públicos, inclusive de unidade inativa.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/Unidade' }
                  - { $ref: '#/components/schemas/UnidadeResumo' }
        '404': { description: Unidade não encontrada. }
        '401': { description: Credencial ausente ou inválida. }
        '403': { description: Chamador ou ator sem permissão. }
        '422': { description: "Parâmetro, cabeçalho ou corpo inválido." }
    put:
      summary: Atualizar cadastro e informações de atendimento da unidade
      security: [{ serviceAuth: [], atorPapel: [], atorId: [], atorUnidade: [] }]
      parameters:
        - name: unidadeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnidadeInput' }
      responses:
        '200': { description: Cadastro atualizado. }
        '404': { description: Unidade não encontrada. }
        '409': { description: Chave idempotente reutilizada com conteúdo diferente (CHAVE_IDEMPOTENTE_CONFLITANTE) ou unidade com mesmo nome e endereço (CADASTRO_CONFLITANTE). }
        '422': { description: "Dados inválidos, inclusive período de atendimento inválido ou sobreposto. Nenhuma alteração é persistida." }
        '401': { description: Credencial ausente ou inválida. }
        '403': { description: Chamador ou ator sem permissão. }
  /internal/v1/unidades/{unidadeId}/horarios:
    put:
      summary: Substituir horários de atendimento da unidade
      security: [{ serviceAuth: [], atorPapel: [], atorId: [], atorUnidade: [] }]
      parameters:
        - name: unidadeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [horarios]
              properties:
                horarios:
                  type: array
                  description: Períodos do mesmo dia não podem se sobrepor nem se repetir. Períodos consecutivos e horários iguais em dias diferentes são permitidos.
                  items: { $ref: '#/components/schemas/Horario' }
      responses:
        '200': { description: Horários substituídos. }
        '404': { description: Unidade não encontrada. }
        '409': { description: Chave idempotente reutilizada com conteúdo diferente. }
        '422': { description: "Dados inválidos, inclusive período de atendimento inválido ou sobreposto. Nenhuma alteração é persistida." }
        '401': { description: Credencial ausente ou inválida. }
        '403': { description: Chamador ou ator sem permissão. }
  /internal/v1/unidades/{unidadeId}/status:
    patch:
      summary: Ativar ou desativar a unidade
      security: [{ serviceAuth: [], atorPapel: [], atorId: [], atorUnidade: [] }]
      parameters:
        - name: unidadeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ativa]
              properties:
                ativa: { type: boolean }
      responses:
        '200': { description: Situação operacional atualizada; cadastro e referências históricas são preservados. }
        '404': { description: Unidade não encontrada. }
        '409': { description: Chave idempotente reutilizada com conteúdo diferente. }
        '401': { description: Credencial ausente ou inválida. }
        '403': { description: Chamador ou ator sem permissão. }
        '422': { description: "Parâmetro, cabeçalho ou corpo inválido." }
  /internal/v1/unidades/{unidadeId}/prazo-analise:
    get:
      summary: Obter prazo de análise para Reservas
      security: [{ serviceAuth: [] }]
      parameters:
        - name: unidadeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Prazo vigente.
          content:
            application/json:
              schema:
                type: object
                required: [prazoAnaliseHoras]
                properties:
                  prazoAnaliseHoras: { type: integer, minimum: 1 }
        '404': { description: Unidade não encontrada ou inativa. }
        '401': { description: Credencial ausente ou inválida. }
        '403': { description: Chamador ou ator sem permissão. }
        '422': { description: "Parâmetro, cabeçalho ou corpo inválido." }
    put:
      summary: Configurar prazo de análise
      security: [{ serviceAuth: [], atorPapel: [], atorId: [], atorUnidade: [] }]
      parameters:
        - name: unidadeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [prazoAnaliseHoras]
              properties:
                prazoAnaliseHoras: { type: integer, minimum: 1, maximum: 720 }
      responses:
        '200': { description: Prazo atualizado; reservas existentes mantêm o prazo já aplicado. }
        '404': { description: Unidade não encontrada. }
        '409': { description: Chave idempotente reutilizada com conteúdo diferente. }
        '401': { description: Credencial ausente ou inválida. }
        '403': { description: Chamador ou ator sem permissão. }
        '422': { description: "Parâmetro, cabeçalho ou corpo inválido." }
