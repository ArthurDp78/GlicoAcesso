openapi: 3.0.0
info:
  title: API de Reservas
  version: "1.0"
  description: Contratos do microsserviço de Reservas. Orquestra a SAGA de confirmação e controla os estados das solicitações.
paths:
  # Rota pública consumida pelo BFF Cidadão
  /api/cidadao/v1/reservas:
    post:
      summary: Criar solicitação de reserva
      description: Valida permissões em Estoque e o prazo em Unidades, e regista o pedido como SOLICITADA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                unidadeId: { type: string, format: uuid }
                itemId: { type: string, format: uuid }
                quantidade: { type: integer, minimum: 1 }
                idempotencyKey: { type: string }
      responses:
        '201':
          description: Solicitação criada com o status SOLICITADA.
        '422':
          description: Erro de negócio (ex. unidade não permite reserva do item ou quantidade inválida).

  /api/cidadao/v1/reservas/{reservaId}/cancelar:
    post:
      summary: Cancelar reserva (pelo Cidadão)
      description: Inicia o fluxo de cancelamento de uma reserva ativa, se a retirada física ainda não tiver ocorrido.
      parameters:
        - name: reservaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Cancelamento aceite (passa a CANCELAMENTO_EM_ANDAMENTO ou CANCELADA).
        '409':
          description: Conflito (a reserva já está num estado terminal como RETIRADA).

  # Rotas consumidas pelo BFF Unidade
  /api/unidade/v1/reservas/{reservaId}/decisao:
    post:
      summary: Registar decisão da unidade (Aceitar/Rejeitar)
      description: Ao aceitar, muda para EM_CONFIRMACAO e inicia a SAGA distribuída.
      parameters:
        - name: reservaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decisao: 
                  type: string
                  enum: [ACEITAR, REJEITAR]
                profissionalId: { type: string }
      responses:
        '200':
          description: Decisão registada. Se aceite, a SAGA foi iniciada.
        '403':
          description: Profissional não vinculado à unidade da reserva.
        '409':
          description: Conflito (o prazo de decisão já expirou).