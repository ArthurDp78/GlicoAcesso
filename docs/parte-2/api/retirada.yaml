openapi: 3.0.3
info:
  title: API de Retiradas
  version: "1.2.0"
  description: Autorizações de balcão e registo de entrega física.
servers:
  - url: /
components:
  securitySchemes:
    serviceAuth:
      type: http
      scheme: bearer
      description: >-
        Credencial própria do serviço ou BFF chamador, verificada pelo destinatário.
        A identidade do ator só é aceita nos cabeçalhos X-Ator-* acompanhados da
        credencial de um chamador autorizado a delegá-la: o BFF Cidadão delega
        somente CIDADAO, o BFF Unidade somente PROFISSIONAL e o Orquestrador os
        atores dos pedidos que persistiu. O token do usuário não é aceito aqui.
    atorPapel:
      type: apiKey
      in: header
      name: X-Ator-Papel
      description: CIDADAO ou PROFISSIONAL. Nunca aceito diretamente do cliente.
    atorId:
      type: apiKey
      in: header
      name: X-Ator-Id
      description: Identificador estável do ator autenticado pelo BFF.
    atorUnidade:
      type: apiKey
      in: header
      name: X-Ator-Unidade-Id
      description: Unidade vinculada ao profissional. Obrigatório para PROFISSIONAL.
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
    SagaIdHeader:
      name: X-Saga-Id
      in: header
      required: true
      description: Identificador da execução que solicitou o comando.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave estável para repetir o mesmo comando com o mesmo resultado.
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    ErroComando:
      type: object
      required: [codigo]
      properties:
        codigo: { type: string }
        mensagem: { type: string }
    ConflitoRevogacao:
      oneOf:
        - type: object
          required: [codigo, retiradaId]
          properties:
            codigo: { type: string, enum: [ENTREGA_JA_REGISTRADA] }
            retiradaId: { type: string, format: uuid }
        - type: object
          required: [codigo]
          properties:
            codigo: { type: string, enum: [CHAVE_IDEMPOTENTE_CONFLITANTE] }
    Autorizacao:
      type: object
      required: [autorizacaoId, reservaId, sagaId, unidadeId, itemId, quantidade, status]
      properties:
        autorizacaoId: { type: string, format: uuid }
        reservaId: { type: string, format: uuid }
        sagaId: { type: string, format: uuid }
        unidadeId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        quantidade: { type: integer, minimum: 1 }
        status: { type: string, enum: [ATIVA, CANCELADA, UTILIZADA] }
paths:
  /internal/v1/autorizacoes/{reservaId}:
    get:
      summary: Consultar autorização vinculada à reserva
      description: Consulta interna usada pelo BFF Unidade para montar a visão operacional. Não substitui o replay idempotente do comando de preparação ou cancelamento.
      security: [{ serviceAuth: [], atorPapel: [], atorId: [], atorUnidade: [] }]
      parameters:
        - name: reservaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Autorização encontrada, inclusive se cancelada ou utilizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Autorizacao' }
        '404': { description: Não existe autorização para a reserva. }
        '503': { description: Estado da autorização indisponível. }
        '401': { description: Credencial ausente ou inválida. }
        '403': { description: Chamador ou ator sem permissão. }
        '422': { description: "Parâmetro, cabeçalho ou corpo inválido." }
  /api/unidade/v1/retiradas:
    post:
      summary: Registar entrega presencial
      description: >-
        A autorização criada pela SAGA não basta para registrar a entrega.
        Retiradas obtém reservaId da autorização e consulta
        GET /internal/v1/reservas/{reservaId}/estado em Reservas, autenticado
        como serviço. Só prossegue com 200, o mesmo reservaId e status CONFIRMADA.
        Timeout, indisponibilidade ou resposta inconclusiva impedem a entrega,
        sem fallback para cache. Na transação local, revalida a autorização
        contra revogação ou uso concorrente e grava entrega e Outbox juntas.
        Repetir a mesma ação com a mesma chave reproduz a resposta original;
        uma nova ação com outra chave encontra a autorização já utilizada e recebe 409.
      security: [{ serviceAuth: [], atorPapel: [], atorId: [], atorUnidade: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [autorizacaoId]
              properties:
                autorizacaoId: { type: string, format: uuid }
      responses:
        '201':
          description: Entrega física registada. Dispara evento retirada.concluida.v1. Repetições idênticas reproduzem esta resposta.
          content:
            application/json:
              schema:
                type: object
                required: [retiradaId, autorizacaoId, realizadaEm]
                properties:
                  retiradaId: { type: string, format: uuid }
                  autorizacaoId: { type: string, format: uuid }
                  realizadaEm: { type: string, format: date-time }
        '409':
          description: Autorização cancelada, já usada ou inexistente; Reserva não encontrada ou estado consultado diferente de CONFIRMADA; ou `Idempotency-Key` reutilizada com conteúdo diferente. Nenhuma nova entrega é registrada.
        '503':
          description: Não foi possível obter o estado canônico de Reservas, inclusive por timeout ou falha técnica na consulta. Nenhuma nova entrega é registrada; uma nova tentativa exige nova consulta.
        '401': { description: Credencial ausente ou inválida. }
        '403': { description: Chamador ou ator sem permissão. }
        '422': { description: "Parâmetro, cabeçalho ou corpo inválido." }
  /internal/v1/autorizacoes:
    post:
      summary: Preparar Autorização (SAGA)
      operationId: prepararAutorizacao
      description: >-
        Somente o Orquestrador após confirmar a alocação. Retiradas grava
        autorização e resultado idempotente na mesma transação. Uma repetição
        idêntica reproduz o resultado conclusivo. A entrega exige validação
        posterior do estado CONFIRMADA em Reservas.
      security: [{ serviceAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sagaId, reservaId, unidadeId, itemId, quantidade]
              properties:
                sagaId: { type: string, format: uuid }
                reservaId: { type: string, format: uuid }
                unidadeId: { type: string, format: uuid }
                itemId: { type: string, format: uuid }
                quantidade: { type: integer, minimum: 1 }
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
      responses:
        '201':
          description: Autorização criada; repetição idêntica reproduz o status e corpo originais.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Autorizacao' }
        '409':
          description: "AUTORIZACAO_INCOMPATIVEL ou CHAVE_IDEMPOTENTE_CONFLITANTE. Esses conflitos não comprovam ausência de autorização para a reserva."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroComando' }
        '422':
          description: "AUTORIZACAO_NAO_CRIADA registra recusa conclusiva com ausência de autorização vinculada à reserva."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroComando' }
        '400':
          description: "Entrada inválida ou cabeçalho obrigatório ausente."
        '401':
          description: "Credencial ausente ou inválida."
        '403':
          description: "Operação restrita ao Orquestrador."
        '503':
          description: "Serviço temporariamente indisponível. Repita o comando com a mesma chave e conteúdo quando o resultado estiver incerto."
  /internal/v1/autorizacoes/{reservaId}/cancelar:
    post:
      summary: Cancelar Autorização (Compensação SAGA)
      operationId: cancelarAutorizacao
      description: >-
        Somente o Orquestrador, para compensação ou cancelamento. O sagaId identifica a execução que solicita a revogação. Retiradas serializa revogação e entrega no registro da autorização e persiste o resultado antes de responder.
        Repetições idênticas devolvem o resultado conclusivo gravado.
      security: [{ serviceAuth: [] }]
      parameters:
        - name: reservaId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/SagaIdHeader' }
        - { $ref: '#/components/parameters/CorrelationId' }
      responses:
        '200':
          description: "Autorização revogada ou já revogada. Resultado durável que permite prosseguir."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Autorizacao' }
        '404':
          description: "AUTORIZACAO_NAO_ENCONTRADA. O Orquestrador reconcilia os comandos anteriores antes de concluir que a autorização nunca existiu."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroComando' }
        '409':
          description: "ENTREGA_JA_REGISTRADA prova que a entrega venceu e impede a liberação. CHAVE_IDEMPOTENTE_CONFLITANTE identifica uso da chave com conteúdo divergente."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConflitoRevogacao' }
        '400':
          description: "Entrada inválida ou cabeçalho obrigatório ausente."
        '401':
          description: "Credencial ausente ou inválida."
        '403':
          description: "Operação restrita ao Orquestrador."
        '503':
          description: "Serviço temporariamente indisponível. Repita o comando com a mesma chave e conteúdo quando o resultado estiver incerto."
