openapi: 3.0.0
info:
  title: API de Retiradas
  version: "1.0"
  description: Contratos do microsserviço de Retiradas, incluindo rotas públicas e comandos internos da SAGA.
paths:
  /internal/v1/autorizacoes:
    post:
      summary: Preparar Autorização (Comando interno da SAGA)
      description: Cria uma autorização apta para uso no balcão.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sagaId: { type: string, format: uuid }
                reservaId: { type: string, format: uuid }
                unidadeId: { type: string, format: uuid }
                itemId: { type: string, format: uuid }
                quantidade: { type: integer, minimum: 1 }
                correlationId: { type: string, format: uuid }
                idempotencyKey: { type: string }
      responses:
        '201':
          description: Autorização preparada com sucesso.
        '409':
          description: Conflito de estado ou idempotência.

  /internal/v1/autorizacoes/{reservaId}/cancelar:
    post:
      summary: Cancelar Autorização (Compensação da SAGA)
      description: Revoga a autorização sem apagar o histórico de registos.
      parameters:
        - name: reservaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Saga-Id
          in: header
          required: true
          schema:
            type: string
        - name: X-Correlation-Id
          in: header
          required: true
          schema:
            type: string
        - name: X-Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Autorização revogada com sucesso.
        '409':
          description: Conflito (ex. se a entrega já ocorreu).