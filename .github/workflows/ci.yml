name: CI

on:
  push:
  pull_request:

jobs:
  testes-integrados:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: glico
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glico -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: glico
          RABBITMQ_DEFAULT_PASS: teste
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GLICO_TESTE_PG: postgresql://glico:teste@127.0.0.1:5432/postgres
      GLICO_TESTE_RABBIT: amqp://glico:teste@127.0.0.1:5672/%2F
      GLICO_TESTE_OBRIGATORIO: "1"
      GLICO_TESTE_TROCAS: ${{ runner.temp }}/trocas.jsonl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Instalar dependências de runtime e validação
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi==0.165.0" \
            "httpx==0.28.1" \
            "pika==1.3.2" \
            "psycopg[binary]==3.3.9" \
            "pydantic==2.14.4" \
            "uvicorn==0.54.0" \
            "pyyaml==6.0.2" \
            "jsonschema==4.25.1"
      - name: Executar testes unitários e integrados
        run: python -m unittest discover -s tests -v
      - name: Validar contratos das trocas reais
        run: python -m tests.contratos "$GLICO_TESTE_TROCAS"
